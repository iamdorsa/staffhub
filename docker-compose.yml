services:

  # ── Database ──────────────────────────────────────────────
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-staffhub_db}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - staffhub
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── phpMyAdmin (optional, dev only) ──────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8080}:80"
    networks:
      - staffhub
    profiles:
      - dev

  # ── Migrations (run-once) ────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: migrate
    environment:
      DATABASE_URL: mysql+pymysql://root:${DB_ROOT_PASSWORD:-root}@mariadb:3306/${DB_NAME:-staffhub_db}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-string}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - staffhub

  # ── Seed admin user (run-once) ───────────────────────────
  seed-admin:
    build:
      context: .
      dockerfile: Dockerfile
    command: seed-admin
    environment:
      DATABASE_URL: mysql+pymysql://root:${DB_ROOT_PASSWORD:-root}@mariadb:3306/${DB_NAME:-staffhub_db}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-string}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - staffhub

  # ── Seed mock data (run-once, optional) ──────────────────
  seed-mock:
    build:
      context: .
      dockerfile: Dockerfile
    command: seed-mock
    environment:
      DATABASE_URL: mysql+pymysql://root:${DB_ROOT_PASSWORD:-root}@mariadb:3306/${DB_NAME:-staffhub_db}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-string}
    depends_on:
      seed-admin:
        condition: service_completed_successfully
    networks:
      - staffhub
    profiles:
      - seed

  # ── Backend API ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: serve
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:${DB_ROOT_PASSWORD:-root}@mariadb:3306/${DB_NAME:-staffhub_db}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-string}
      WORKERS: ${API_WORKERS:-4}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_API_KEY: ${SMS_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - staffhub
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend (Nginx + React SPA) ─────────────────────────
  web:
    build:
      context: ../staffhub-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - staffhub

  # ── Reservation expiry cron job ──────────────────────────
  cron:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Reservation expiry cron starting..."
        while true; do
          /docker-entrypoint.sh expire-reservations || true
          sleep 3600
        done
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:${DB_ROOT_PASSWORD:-root}@mariadb:3306/${DB_NAME:-staffhub_db}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-string}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - staffhub
    profiles:
      - cron

volumes:
  mariadb_data:

networks:
  staffhub:
    driver: bridge
